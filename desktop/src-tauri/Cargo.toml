[package]
name = "edenvoice-desktop"
version = "0.8.5"
authors = ["SmileSion"]
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
edenvoice-client = { path = "../../client" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11", features = ["macos-private-api", "tray-icon", "image-png"] }
rfd = "0.16"
zeroize = "1.8"
tauri-plugin-updater = "~2.11"
minisign-verify = "0.2"
base64 = "0.22"
semver = "1"
url = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = "symbols"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Registry"] }

[patch.crates-io]
tract-nnef = { path = "../../vendor/tract-nnef-0.19.16" }
tauri-plugin-updater = { path = "../../vendor/tauri-plugin-updater-2.11.0" }
tract-onnx = { path = "../../vendor/tract-onnx-0.19.16" }
glib = { path = "../../vendor/glib-0.18.5" }
