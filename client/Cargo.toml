[package]
name = "edenvoice-client"
version = "0.8.5"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1.0"
argon2 = "0.5"
audiopus = "0.3.0-rc.0"
cpal = "0.18.2"
crossbeam-channel = "0.5.16"
directories = "6.0"
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet.git", rev = "978576aa8400552a4ce9730838c635aa30db5e61", default-features = false, features = ["tract", "default-model"] }
slint = "1.17.1"
global-hotkey = "0.8.0"
if-addrs = "0.13"
ndarray = "0.15"
rnnoise2 = "0.1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sonora = "0.2.0"
sonora-common-audio = "0.2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webrtc-audio-processing-sys = { version = "2.1.0", features = ["bundled"] }
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
rfd = "0.16"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
hkdf = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sha2 = "0.10"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
x509-parser = "0.17"
zeroize = { version = "1.8", features = ["zeroize_derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
i-slint-backend-winit = "1.17.1"
winit = "0.30.13"

[dev-dependencies]
i-slint-backend-testing = { version = "1.17.1", features = ["renderer-software"] }
tempfile = "3.27"
tract-nnef = "=0.19.16"

[patch.crates-io]
tract-nnef = { path = "../vendor/tract-nnef-0.19.16" }
tract-onnx = { path = "../vendor/tract-onnx-0.19.16" }
